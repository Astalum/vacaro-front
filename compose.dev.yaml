services:
  web:
    build:
      context: .
      target: development-dependencies-env
    command: npm run dev -- --host 0.0.0.0
    environment:
      VACARO_API_URL: http://host.docker.internal:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
